<script>
  (function() {
    var AC_SUCCESS_CLASS = '_form-thank-you';
    
    window.dataLayer = window.dataLayer || [];
  
    document.addEventListener('submit', function(e) {
      var form = e.target;
      
      if (form.id && form.id.indexOf('_form_') === 0) {
        
        // SCRAPE DATA: Grab all inputs immediately upon submit
        var formData = {};
        var inputs = form.querySelectorAll('input, select, textarea');
        
        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          var name = input.name || input.id || 'field_' + i;
          
          if (input.type !== 'submit' && input.type !== 'button' && input.type !== 'password') {
               if ((input.type === 'radio' || input.type === 'checkbox') && !input.checked) {
                  continue;
               }
               formData[name] = input.value;
          }
        }
  
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.addedNodes.length) {
              for (var i = 0; i < mutation.addedNodes.length; i++) {
                var node = mutation.addedNodes[i];
                
                if (node.classList && node.classList.contains(AC_SUCCESS_CLASS)) {
                  
                  window.dataLayer.push({
                    'event': 'activeCampaignFormSuccess',
                    'formId': form.id,
                    'acFormData': formData
                  });
                  
                  observer.disconnect();
                }
              }
            }
          });
        });
  
        observer.observe(form, { childList: true, subtree: true });
  
        setTimeout(function() { 
          observer.disconnect(); 
        }, 5000);
      }
    }, true); 
  })();
  </script>
